name: Build and Host Resume PDF

on:
  push:
    branches:
      - main
    paths:
      - 'resume.typ'
      - '.github/workflows/build.yml'
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Typst
        uses: typst-community/setup-typst@v3

      - name: Compile PDF and Preview Image
        run: |
          mkdir -p dist
          typst compile resume.typ dist/Zachary_Gerbi_Resume.pdf
          typst compile --ppi 250 resume.typ dist/preview-{p}.png
          cp dist/preview-1.png dist/preview.png

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages Artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: 'dist'

      - name: Publish Direct-Download Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest
          name: Latest Resume Build
          files: |
            dist/Zachary_Gerbi_Resume.pdf
            dist/preview.png
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}Zachary_Gerbi_Resume.pdf
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
