name: Build and Deploy Resume PDF

on:
  push:
    branches:
      - main
    paths:
      - 'resume.typ'
      - '.github/workflows/build.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Setup Typst
        uses: typst-community/setup-typst@v3

      - name: Compile PDF
        run: |
          typst compile resume.typ Zachary_Gerbi_Resume.pdf

      - name: Upload PDF Artifact
        uses: actions/upload-artifact@v4
        with:
          name: resume-pdf
          path: Zachary_Gerbi_Resume.pdf

      - name: Deploy to Output Branch
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_branch: pdf-download
          publish_dir: .
          destination_dir: .
          keep_files: false
          exclude_assets: '.github,resume.typ,README.md'
